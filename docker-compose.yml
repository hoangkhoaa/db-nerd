version: '3.8'

services:
  # 1. PostgreSQL 16 Test Database
  postgres-test:
    image: postgres:16-alpine
    container_name: db_nerd_postgres
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ecom_prod_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 2. MySQL 8 Test Database
  mysql-test:
    image: mysql:8.0
    container_name: db_nerd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
      MYSQL_DATABASE: analytics_staging
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 3. Redis 7 Test Database
  redis-test:
    image: redis:7-alpine
    container_name: db_nerd_redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
  mysql_data:
