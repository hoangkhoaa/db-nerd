<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cockroach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2818" />
      <stop offset="100%" stop-color="#041109" />
    </linearGradient>
    <linearGradient id="g-cockroach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19a347" />
      <stop offset="100%" stop-color="#69db7c" />
    </linearGradient>
    <linearGradient id="g-cockroach-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19a347" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#69db7c" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-cockroach" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-cockroach)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
