<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bigquery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#050b17" />
    </linearGradient>
    <linearGradient id="g-bigquery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4" />
      <stop offset="100%" stop-color="#34a853" />
    </linearGradient>
    <linearGradient id="g-bigquery-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34a853" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-bigquery" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-bigquery)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-bigquery)">
    <circle cx="50" cy="46" r="26" fill="none" stroke="url(#g-bigquery)" stroke-width="6" />
          <path d="M68 64 L85 81" stroke="#4285f4" stroke-width="7" stroke-linecap="round" />
          <rect x="36" y="38" width="6" height="16" rx="3" fill="#34a853" />
          <rect x="47" y="30" width="6" height="24" rx="3" fill="#4285f4" />
          <rect x="58" y="42" width="6" height="12" rx="3" fill="#ea4335" />
  </g>
</svg>