<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vertica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1d33" />
      <stop offset="100%" stop-color="#040c17" />
    </linearGradient>
    <linearGradient id="g-vertica" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c85d0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="g-vertica-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c85d0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-vertica" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-vertica)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-vertica)">
    <polygon points="50,22 78,38 78,70 50,86 22,70 22,38" fill="none" stroke="url(#g-vertica)" stroke-width="5" />
          <polyline points="28,42 50,72 72,42" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>