<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cassandra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14202d" />
      <stop offset="100%" stop-color="#080d14" />
    </linearGradient>
    <linearGradient id="g-cassandra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18809c" />
      <stop offset="100%" stop-color="#4cd1e6" />
    </linearGradient>
    <linearGradient id="g-cassandra-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18809c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4cd1e6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-cassandra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-cassandra)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-cassandra)">
    <ellipse cx="50" cy="50" rx="35" ry="22" fill="none" stroke="url(#g-cassandra)" stroke-width="5" />
          <circle cx="50" cy="50" r="14" fill="url(#g-cassandra-fill)" />
          <circle cx="50" cy="50" r="6" fill="#ffffff" filter="drop-shadow(0 0 8px #4cd1e6)" />
  </g>
</svg>