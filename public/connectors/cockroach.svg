  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-cockroach)">
    <path d="M50 24 L75 40 L75 66 L50 82 L25 66 L25 40 Z" fill="none" stroke="url(#g-cockroach)" stroke-width="5" />
          <path d="M50 32 L68 44 L68 62 L50 72 L32 62 L32 44 Z" fill="url(#g-cockroach-fill)" opacity="0.8" />
          <circle cx="43" cy="46" r="3" fill="#ffffff" />
          <circle cx="57" cy="46" r="3" fill="#ffffff" />
  </g>
</svg>