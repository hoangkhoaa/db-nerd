<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-elasticsearch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082329" />
      <stop offset="100%" stop-color="#030e11" />
    </linearGradient>
    <linearGradient id="g-elasticsearch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00bfb3" />
      <stop offset="100%" stop-color="#fed100" />
    </linearGradient>
    <linearGradient id="g-elasticsearch-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00bfb3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fed100" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-elasticsearch" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-elasticsearch)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-elasticsearch)">
    <path d="M22 45 A 28 28 0 0 1 78 45 Z" fill="#00bfb3" opacity="0.9" />
          <rect x="22" y="47" width="56" height="6" rx="3" fill="#fed100" />
          <path d="M22 55 A 28 28 0 0 0 78 55 Z" fill="#343741" stroke="#00bfb3" stroke-width="3" />
  </g>
</svg>