<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-oracle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e0c0c" />
      <stop offset="100%" stop-color="#140404" />
    </linearGradient>
    <linearGradient id="g-oracle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f80000" />
      <stop offset="100%" stop-color="#ff4d4d" />
    </linearGradient>
    <linearGradient id="g-oracle-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f80000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-oracle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-oracle)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-oracle)">
    <rect x="22" y="32" width="56" height="36" rx="18" fill="none" stroke="url(#g-oracle)" stroke-width="7" />
          <circle cx="50" cy="50" r="7" fill="#ffffff" filter="drop-shadow(0 0 8px #ff4d4d)" />
  </g>
</svg>