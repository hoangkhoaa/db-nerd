<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBNerd</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var appTheme = urlTheme;
          if (!appTheme) {
            var raw = localStorage.getItem('db_nerd_user_settings');
            if (raw) {
              var parsed = JSON.parse(raw);
              appTheme = parsed.appTheme || (parsed.themeMode === 'light' ? 'default-light' : 'default-dark');
            }
          }
          if (appTheme === 'light' || appTheme === 'default-light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'default-light');
          } else if (appTheme === 'dark' || appTheme === 'default-dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'default-dark');
          } else if (appTheme && appTheme !== 'auto') {
            // Custom developer themes (Monokai, Dracula, One Dark, etc.)
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', appTheme);
          } else {
            // Auto
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
              document.documentElement.classList.remove('light');
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'default-dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              document.documentElement.setAttribute('data-theme', 'default-light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
