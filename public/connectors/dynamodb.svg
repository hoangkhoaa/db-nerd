<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dynamodb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1c32" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="g-dynamodb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2771dc" />
      <stop offset="100%" stop-color="#59a5f5" />
    </linearGradient>
    <linearGradient id="g-dynamodb-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2771dc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#59a5f5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-dynamodb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-dynamodb)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-dynamodb)">
    <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#2771dc" stroke-width="4" transform="rotate(-30 50 50)" />
          <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#59a5f5" stroke-width="4" transform="rotate(30 50 50)" />
          <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="#60a5fa" stroke-width="3" transform="rotate(90 50 50)" />
          <circle cx="50" cy="50" r="9" fill="#ffffff" filter="drop-shadow(0 0 8px #59a5f5)" />
  </g>
</svg>