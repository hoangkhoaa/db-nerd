<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-redshift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d0e15" />
      <stop offset="100%" stop-color="#140508" />
    </linearGradient>
    <linearGradient id="g-redshift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3e44" />
      <stop offset="100%" stop-color="#ff8c42" />
    </linearGradient>
    <linearGradient id="g-redshift-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3e44" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff8c42" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow-redshift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Apple macOS Squircle Body -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg-redshift)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Top Glass Glare -->
  <path d="M 5 26 C 5 14 14 5 26 5 L 74 5 C 86 5 95 14 95 26 L 95 44 C 70 48 30 48 5 44 Z" fill="rgba(255,255,255,0.06)" />
  
  <!-- Centered Connector Emblem -->
  <g filter="url(#glow-redshift)">
    <path d="M50 20 L80 38 L80 72 L50 90 L20 72 L20 38 Z" fill="none" stroke="url(#g-redshift)" stroke-width="5" />
          <path d="M50 35 L70 47 L70 68 L50 80 L30 68 L30 47 Z" fill="url(#g-redshift-fill)" opacity="0.8" />
          <circle cx="50" cy="55" r="8" fill="#ffffff" filter="drop-shadow(0 0 8px #ff3e44)" />
  </g>
</svg>